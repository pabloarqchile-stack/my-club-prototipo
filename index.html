<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Club</title>
<meta name="description" content="My Club – prototipo para administrar clubes deportivos, asociaciones y federaciones de Chile.">
<meta name="theme-color" content="#1F4E79">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My Club">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* ======================================================================
   SISTEMA DE DISEÑO
   ====================================================================== */
:root{
  --primary:#1F4E79; --primary2:#2C6CA6; --hdr:#1F4E79; --ptext:#1F4E79; --psoft:#E7EFF7;
  --accent:#1BAF7A; --atext:#0E7A54; --asoft:#E2F6EE;
  --danger:#E5484D; --dtext:#C4282D; --dsoft:#FDECEC;
  --warn:#F5A524; --wtext:#A15C07; --wsoft:#FEF3E0;
  --bg:#F2F4F7; --card:#FFFFFF; --text:#101828; --muted:#667085; --line:#E4E7EC; --fill:#EAEEF3; --fill2:#D0D5DD;
  --tabbg:rgba(255,255,255,.9); --desk:#D9E2EC; --shadow:0 1px 2px rgba(16,24,40,.04),0 2px 10px rgba(16,24,40,.06);
  --r:16px;
}
@media (prefers-color-scheme:dark){:root{
  --hdr:#163A5C; --ptext:#8BBBEA; --psoft:#16283C; --primary2:#3B7FC0;
  --atext:#4FD6A2; --asoft:#0F2E24; --dtext:#FF8A8E; --dsoft:#3A1517; --wtext:#F7BE5C; --wsoft:#33260E;
  --bg:#0B111B; --card:#151D2A; --text:#EEF2F7; --muted:#98A2B3; --line:#263244; --fill:#1E2838; --fill2:#344054;
  --tabbg:rgba(21,29,42,.92); --desk:#05080D; --shadow:0 1px 2px rgba(0,0,0,.4);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Arial,sans-serif;background:var(--desk);color:var(--text);-webkit-font-smoothing:antialiased;overflow:hidden;font-size:15px;line-height:1.35}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit}
#phone{position:relative;width:100%;height:100%;height:100dvh;margin:0 auto;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
@media (min-width:600px){
  body{display:flex;align-items:center;justify-content:center}
  #phone{width:390px;height:min(844px,calc(100vh - 40px));border-radius:48px;box-shadow:0 0 0 11px #111827,0 0 0 13px #2b3443,0 30px 80px rgba(0,0,0,.35)}
  .hdr{padding-top:30px!important}
  .tabbar{padding-bottom:16px!important}
}
/* Header */
.hdr{background:var(--hdr);color:#fff;padding:calc(env(safe-area-inset-top) + 4px) 6px 6px;display:flex;align-items:center;gap:2px;min-height:52px;flex-shrink:0;z-index:5}
.hdr .ttl{flex:1;text-align:center;font-weight:650;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.hb{width:44px;height:44px;display:grid;place-items:center;border:0;background:transparent;color:#fff;border-radius:12px;position:relative;flex-shrink:0}
.hb:active{background:rgba(255,255,255,.15)}
.hb .count{position:absolute;top:5px;right:4px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px;border:2px solid var(--hdr)}
.hb.ph{visibility:hidden}
/* Vista */
#view{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:16px 16px 28px;overscroll-behavior:contain}
#view.enter{animation:enter .22s ease}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.bare #view{padding:0}
/* Tabbar */
.tabbar{display:flex;border-top:.5px solid var(--line);background:var(--tabbg);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);padding-bottom:env(safe-area-inset-bottom);flex-shrink:0;z-index:5}
.tab{flex:1;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:500;color:var(--muted);border:0;background:none;position:relative}
.tab.on{color:var(--ptext)}
.tab .dot{position:absolute;top:5px;left:calc(50% + 8px);background:var(--danger);color:#fff;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 4px}
/* Tarjetas y listas */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.card.hero{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff}
.card.hero .muted{color:rgba(255,255,255,.8)}
.list{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px}
.li{display:flex;align-items:center;gap:12px;padding:11px 14px;min-height:56px;border:0;background:none;width:100%;text-align:left;color:inherit;position:relative}
button.li:active{background:var(--fill)}
.li+.li::before{content:"";position:absolute;top:0;left:62px;right:0;border-top:.5px solid var(--line)}
.li .tx{flex:1;min-width:0}
.li .t{display:block;font-weight:600;font-size:15px}
.li .s{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.li .chev{color:var(--fill2);display:flex}
.ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;color:#fff}
.c-blue{background:linear-gradient(135deg,#2C6CA6,#1F4E79)}.c-green{background:linear-gradient(135deg,#2BC48A,#14946A)}
.c-orange{background:linear-gradient(135deg,#FFA94D,#F07B1E)}.c-purple{background:linear-gradient(135deg,#9B7BF0,#6A4BD8)}
.c-red{background:linear-gradient(135deg,#FF7076,#E03A40)}.c-teal{background:linear-gradient(135deg,#2EC5D3,#0E8FA0)}
.c-indigo{background:linear-gradient(135deg,#6C7BF5,#4150D8)}.c-pink{background:linear-gradient(135deg,#F67FB5,#D9468C)}
.c-yellow{background:linear-gradient(135deg,#FFD15C,#F2A90F)}.c-gray{background:linear-gradient(135deg,#98A2B3,#667085)}
.sec{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:22px 4px 8px}
.sec:first-child{margin-top:4px}
.sec .lnk{text-transform:none;letter-spacing:0;font-size:15px;color:var(--ptext);border:0;background:none;min-height:44px;padding:0 4px;font-weight:600}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}.b{font-weight:650}.center{text-align:center}
.row{display:flex;align-items:center;gap:10px}.row.wrap{flex-wrap:wrap}.sp{flex:1}.gap8{gap:8px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}
h1,h2,h3{margin:0}h2{font-size:22px;font-weight:750;letter-spacing:-.01em}h3{font-size:17px;font-weight:650}
.big{font-size:30px;font-weight:750;letter-spacing:-.02em}
/* Botones */
.btn{min-height:50px;border-radius:14px;border:0;padding:0 18px;font-weight:650;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--primary);color:#fff;width:100%;transition:transform .12s,opacity .12s;text-decoration:none}
.btn:active{transform:scale(.98);opacity:.88}
.btn.s2{background:var(--psoft);color:var(--ptext)}
.btn.ok{background:var(--accent)}.btn.danger{background:var(--danger)}
.btn.naranjo{background:#F47A1F;color:#0E2A44}.btn.calipso{background:#1CD1BF;color:#0E2A44}
.btn.dsoft{background:var(--dsoft);color:var(--dtext)}
.btn.ghost{background:transparent;color:var(--ptext)}
.btn.sm{min-height:44px;font-size:14px;padding:0 14px;width:auto;border-radius:12px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btns{display:flex;gap:10px;margin-top:12px}.btns .btn{flex:1}
.ibtn{width:44px;height:44px;border-radius:12px;border:0;background:var(--fill);color:var(--text);display:grid;place-items:center;flex-shrink:0}
.ibtn.on{background:var(--psoft);color:var(--ptext)}
/* Insignias */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:650;padding:3px 9px;border-radius:999px;white-space:nowrap}
.b-ok{background:var(--asoft);color:var(--atext)}.b-warn{background:var(--wsoft);color:var(--wtext)}
.b-bad{background:var(--danger);color:#fff}.b-badsoft{background:var(--dsoft);color:var(--dtext)}
.b-info{background:var(--psoft);color:var(--ptext)}.b-mute{background:var(--fill);color:var(--muted)}
/* Formularios */
.field{margin-bottom:14px}
.field>label{display:block;font-size:13px;font-weight:650;color:var(--muted);margin:0 0 6px 2px}
.input{width:100%;min-height:50px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:12px 14px;font-size:16px;-webkit-appearance:none;appearance:none;outline:none}
.input:focus{border-color:var(--primary2);box-shadow:0 0 0 3px var(--psoft)}
select.input{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 22px,calc(100% - 15px) 22px;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
textarea.input{min-height:96px;resize:vertical}
.input[readonly]{background:var(--fill);color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted);margin:6px 2px 0}
.err{font-size:13px;color:var(--dtext);margin:6px 2px 0;font-weight:600}
.check{display:flex;align-items:center;gap:12px;min-height:48px;padding:6px 2px}
.check input{width:22px;height:22px;accent-color:var(--primary2);flex-shrink:0}
/* Interruptor iOS */
.sw{position:relative;display:inline-block;width:51px;height:31px;flex-shrink:0}
.sw input{position:absolute;opacity:0;width:100%;height:100%;margin:0;z-index:1;cursor:pointer}
.sw span{position:absolute;inset:0;background:var(--fill2);border-radius:999px;transition:.2s}
.sw span::after{content:"";position:absolute;width:27px;height:27px;left:2px;top:2px;background:#fff;border-radius:50%;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:.2s}
.sw input:checked+span{background:var(--accent)}
.sw input:checked+span::after{transform:translateX(20px)}
.sw input:disabled+span{opacity:.4}
/* Segmentado y chips */
.seg{display:flex;background:var(--fill);border-radius:12px;padding:2px;margin-bottom:14px}
.seg button{flex:1;min-height:40px;border:0;background:none;border-radius:10px;font-weight:600;font-size:13.5px;color:var(--text)}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 12px;padding:2px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
/* Grilla de inicio */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 6px;padding:4px 0}
.tile{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0;min-height:88px;position:relative}
.tile .ti{width:58px;height:58px;border-radius:17px;display:grid;place-items:center;color:#fff;box-shadow:0 4px 10px rgba(16,24,40,.12);transition:transform .15s}
.tile:active .ti{transform:scale(.92)}
.tile .tl{font-size:11.5px;font-weight:550;text-align:center;line-height:1.2;max-width:84px}
.tile .pinm{position:absolute;top:-4px;right:8px;width:20px;height:20px;border-radius:50%;background:var(--card);color:var(--ptext);display:grid;place-items:center;box-shadow:var(--shadow)}
.tile .tb{position:absolute;top:-4px;right:6px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 5px}
.edrow{display:flex;align-items:center;gap:6px;padding:8px 10px;min-height:60px}
.edrow+.edrow{border-top:.5px solid var(--line)}
.edrow .ibtn{width:40px;height:40px}
.edrow.hid{opacity:.5}
/* Estados vacíos, notas */
.empty{text-align:center;padding:36px 24px;color:var(--muted)}
.empty .ei{width:64px;height:64px;margin:0 auto 12px;border-radius:20px;background:var(--psoft);color:var(--ptext);display:grid;place-items:center}
.empty h3{color:var(--text);margin-bottom:6px}
.empty p{margin:0 0 16px;font-size:14px}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--psoft);color:var(--ptext);border-radius:12px;padding:12px;font-size:13.5px;margin-bottom:12px}
.note.warn{background:var(--wsoft);color:var(--wtext)}.note.bad{background:var(--dsoft);color:var(--dtext)}.note.ok{background:var(--asoft);color:var(--atext)}
.note svg{flex-shrink:0;margin-top:1px}
/* Avatares */
.clog{object-fit:contain;border-radius:22%;background:#fff;flex-shrink:0;display:block}
.av{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex-shrink:0;letter-spacing:.02em}
/* Toasts */
.toasts{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 58px);z-index:60;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:8px}
.toast{background:rgba(16,24,40,.94);color:#fff;border-radius:14px;padding:12px 16px;font-size:14px;font-weight:550;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:tin .3s cubic-bezier(.2,.9,.3,1.2);max-width:100%}
.toast.out{animation:tout .25s ease forwards}
.toast .ti{color:#4FD6A2;display:flex}.toast.warn .ti{color:#F7BE5C}.toast.bad .ti{color:#FF8A8E}
@keyframes tin{from{opacity:0;transform:translateY(-14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(-10px)}}
/* Hoja inferior */
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.42);z-index:40;opacity:0;transition:opacity .25s}
.backdrop.show{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:22px 22px 0 0;max-height:90%;overflow-y:auto;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);padding:6px 16px calc(20px + env(safe-area-inset-bottom));z-index:41}
.sheet.show{transform:none}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--fill2);margin:4px auto 10px}
.sheet h3{margin:4px 0 14px;text-align:center}
.overlay{position:absolute;inset:0;z-index:70;background:rgba(11,17,27,.72);display:grid;place-items:center;color:#fff;text-align:center;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.spinner{width:46px;height:46px;border-radius:50%;border:4px solid rgba(255,255,255,.25);border-top-color:#fff;animation:spin .8s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
/* Gráficos */
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:10px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hbar{display:grid;grid-template-columns:96px 1fr 44px;align-items:center;gap:8px;font-size:12.5px;margin:7px 0}
.hbar .bar{height:10px;border-radius:6px;background:var(--fill);overflow:hidden}
.hbar .bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--primary2),var(--accent))}
.hbar b{text-align:right}
.prog{height:10px;border-radius:6px;background:var(--fill);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .4s}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px}
.kpi .kv{font-size:21px;font-weight:750;letter-spacing:-.01em;margin-top:2px}
.kpi .kl{font-size:12.5px;color:var(--muted)}
/* Calendario */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:14px}
.wd{border:0;background:var(--card);border-radius:12px;padding:6px 0;display:flex;flex-direction:column;align-items:center;min-height:62px;box-shadow:var(--shadow)}
.wd .n{font-size:17px;font-weight:700}.wd .d{font-size:11px;color:var(--muted);text-transform:uppercase}
.wd.on{background:var(--primary);color:#fff}.wd.on .d{color:rgba(255,255,255,.8)}
.wd .dots{display:flex;gap:2px;height:6px;margin-top:3px}.wd .dots i{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.ev{display:flex;gap:12px}
.ev .when{width:52px;flex-shrink:0;text-align:center;border-radius:12px;background:var(--psoft);color:var(--ptext);padding:6px 0;align-self:flex-start}
.ev .when b{display:block;font-size:20px;line-height:1.1}.ev .when span{font-size:11px;text-transform:uppercase;font-weight:650}
/* Muro */
.post .ph{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:4/3;margin:10px 0;display:grid;place-items:center;font-size:84px;background:linear-gradient(135deg,hsl(var(--h),70%,52%),hsl(calc(var(--h) + 40),75%,38%))}
.post .ph::before,.post .ph::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.14)}
.post .ph::before{width:220px;height:220px;right:-60px;top:-80px}.post .ph::after{width:140px;height:140px;left:-40px;bottom:-50px}
.post .ph .pl{position:absolute;width:64px;height:64px;border-radius:50%;background:rgba(0,0,0,.45);display:grid;place-items:center;color:#fff;z-index:1}
.post .ph .du{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;font-weight:600;padding:2px 8px;border-radius:8px;z-index:1}
.post .ph .vp{position:absolute;left:0;bottom:0;height:4px;background:#fff;z-index:2;width:0}
.post .ph.playing .vp{animation:vp 6s linear forwards}
@keyframes vp{to{width:100%}}
.pact{display:flex;gap:4px;border-top:.5px solid var(--line);margin:0 -16px -16px;padding:2px 8px}
.pact button{flex:1;min-height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:14px;color:var(--muted)}
.pact button.on{color:var(--danger)}
svg.fill path{fill:currentColor}
/* Chat */
.chatw{display:flex;flex-direction:column;min-height:100%}
.msgs{display:flex;flex-direction:column;gap:6px;padding-bottom:8px;flex:1}
.bub{max-width:78%;padding:9px 13px;border-radius:18px;font-size:15px;background:var(--card);box-shadow:var(--shadow);align-self:flex-start}
.bub.me{align-self:flex-end;background:var(--primary2);color:#fff}
.bub .who{font-size:12px;font-weight:700;color:var(--ptext);margin-bottom:2px}
.bub .tm{font-size:11px;opacity:.65;margin-top:3px;text-align:right}
.composer{position:sticky;bottom:-28px;margin:0 -16px -28px;padding:8px 12px calc(10px + env(safe-area-inset-bottom));background:var(--tabbg);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:.5px solid var(--line);display:flex;gap:8px;align-items:center}
.composer .input{min-height:44px;border-radius:22px;padding:10px 16px}
.composer .ibtn{border-radius:22px;background:var(--primary2);color:#fff}
/* Login */
.login{min-height:100%;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(160deg,#1F4E79 0%,#163A5C 45%,#0E2A44 100%);color:#fff;padding:calc(env(safe-area-inset-top) + 36px) 20px calc(env(safe-area-inset-bottom) + 28px)}
.login .brand{display:block;width:min(56vw,216px);height:auto;margin:0 auto 22px;filter:drop-shadow(0 10px 24px rgba(0,0,0,.35))}
.login .card{color:var(--text)}
.login .sec{color:rgba(255,255,255,.75)}
/* Documentos imprimibles */
.docp{background:#fff;color:#1d2433;border-radius:12px;padding:22px 20px;box-shadow:var(--shadow);border:1px solid #e4e7ec;position:relative;overflow:hidden;margin-bottom:12px}
.docp::before{content:"";position:absolute;inset:0;border:6px double #1F4E79;border-radius:12px;pointer-events:none;opacity:.25}
.docp .dh{display:flex;align-items:center;gap:10px;border-bottom:2px solid #1F4E79;padding-bottom:10px;margin-bottom:14px}
.docp .dh .lg{flex-shrink:0}
.docp h2{font-size:18px;color:#1F4E79;text-align:center;margin:6px 0 12px;text-transform:uppercase;letter-spacing:.06em}
.docp .kv{display:grid;grid-template-columns:120px 1fr;gap:5px 10px;font-size:13px;margin:10px 0}
.docp .kv dt{color:#667085}.docp .kv dd{margin:0;font-weight:600}
.docp .ver{display:flex;gap:12px;align-items:center;border-top:1px dashed #c8ced8;margin-top:14px;padding-top:12px;font-size:11.5px;color:#475467}
.docp table{width:100%;border-collapse:collapse;font-size:12.5px;margin:6px 0}
.docp td,.docp th{padding:5px 4px;border-bottom:1px solid #eef0f3;text-align:left}
.docp th{color:#667085;font-weight:600}
.lockf{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:12px;padding:12px 14px;min-height:50px;color:var(--muted);font-size:15px}
/* Credencial */
.cred{border-radius:20px;padding:18px;color:#fff;background:linear-gradient(135deg,#1F4E79 0%,#2C6CA6 55%,#1BAF7A 130%);box-shadow:0 14px 34px rgba(31,78,121,.35);position:relative;overflow:hidden}
.cred::after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.08);right:-90px;top:-110px}
.cred .qrw{background:#fff;border-radius:12px;padding:6px;display:inline-block}
/* Escáner */
.scan{position:relative;aspect-ratio:3/4;border-radius:22px;overflow:hidden;background:radial-gradient(circle at 50% 40%,#2a3442,#0b0f15)}
.scan .fr{position:absolute;inset:18%;border-radius:18px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.scan .fr::before{content:"";position:absolute;inset:-3px;border:3px solid #1BAF7A;border-radius:20px;-webkit-mask:linear-gradient(#000 0 0) top left/30% 30% no-repeat,linear-gradient(#000 0 0) top right/30% 30% no-repeat,linear-gradient(#000 0 0) bottom left/30% 30% no-repeat,linear-gradient(#000 0 0) bottom right/30% 30% no-repeat;mask:linear-gradient(#000 0 0) top left/30% 30% no-repeat,linear-gradient(#000 0 0) top right/30% 30% no-repeat,linear-gradient(#000 0 0) bottom left/30% 30% no-repeat,linear-gradient(#000 0 0) bottom right/30% 30% no-repeat}
.scan .ln{position:absolute;left:20%;right:20%;height:3px;background:#1BAF7A;box-shadow:0 0 14px #1BAF7A;top:20%;animation:scan 1.6s ease-in-out infinite alternate}
@keyframes scan{to{top:78%}}
.scan .lbl{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:#fff;font-size:14px}
/* Disponibilidad recintos */
.avail{display:grid;grid-template-columns:44px repeat(7,1fr);gap:3px;font-size:11px;text-align:center}
.avail .h{color:var(--muted);font-weight:650;padding:4px 0}
.avail button{min-height:30px;border:0;border-radius:6px;font-size:10px;font-weight:650}
.avail .free{background:var(--asoft);color:var(--atext)}.avail .busy{background:var(--fill);color:var(--muted);text-decoration:line-through}
.countdown{font-size:56px;font-weight:800;letter-spacing:-.03em;line-height:1;color:var(--dtext)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl td,.tbl th{padding:9px 6px;border-bottom:.5px solid var(--line);text-align:left}
.tbl th{color:var(--muted);font-weight:600;font-size:12px}
.fab{position:sticky;bottom:12px;float:right;margin-top:-8px;width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 8px 20px rgba(27,175,122,.45);z-index:3}
/* Impresión */
@media print{
  @page{margin:12mm}
  body{overflow:visible;background:#fff;display:block}
  #phone{box-shadow:none!important;width:auto!important;height:auto!important;border-radius:0!important;display:block;overflow:visible;background:#fff}
  .hdr,.tabbar,.noprint,.toasts,.backdrop,.sheet{display:none!important}
  #view{overflow:visible;padding:0}
  .docp{box-shadow:none;border:0}
}

const STORE_KEY = 'myclub-demo-v1';
let S;
function load() {
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) { const o = JSON.parse(raw); if (o && o.v === 3) return o; } } catch (e) { console.warn('Estado no disponible', e); }
  return seed();
}
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); return true; } catch (e) { console.warn('No se pudo guardar', e); return false; } }

function syncCoach() {
  const a = acct();
  if (role() !== 'entrenador' || !a || a.demo || !a.clubId) return;
  const ts = S.teams.filter(t => t.clubId === a.clubId); S.users.entrenador.teams = ts.map(t => t.id); S.users.entrenador.sport = ts[0] ? ts[0].sport : null;
}
function applyAccount(a) {
  S.session.accountId = a.id; S.session.role = a.role; S.ui.editHome = false;
  if (a.role === 'jugador') S.users.jugador = a.refId;

  if (a.role === 'proveedor') S.ui.provId = a.refId;
  if (a.role === 'federacion') { S.users.federacion = { ...a.profile }; S.ui.fedSport = a.sport; S.ui.fedScope = 'nacional'; }
  if (a.role === 'entrenador' || a.role === 'directivo') S.users[a.role] = { ...a.profile, clubId: a.clubId || null };
  syncCoach();
}
const needsClub = () => { const r = role(); if (r === 'entrenador') { syncCoach(); return !coach().clubId || !coach().teams.length; } return false; };
const needsKid = () => role() === 'apoderado' && !myGuardian().kids.length;

const myLinks = a => S.linkRequests.filter(r => r.accountId === a.id);
function requestLink(a, clubId) {
  if (a.clubId === clubId) return { error: 'Ya estás vinculado a este club.' };
  if (myLinks(a).some(r => r.clubId === clubId && r.status === 'pendiente')) return { error: 'Ya enviaste una solicitud a este club.' };
  S.linkRequests.unshift({ id: uid('lk'), accountId: a.id, clubId, date: today(), status: 'pendiente' });
  notify('directivo', `${a.name} (${typeLabel(a.type)}) pide vincularse a ${club(clubId).short}.`, '/d/solicitudes', clubId);
  return { ok: true };
}
function resolveLink(id, ok) {
  const r = S.linkRequests.find(x => x.id === id), a = S.accounts.find(x => x.id === r.accountId);
  r.status = ok ? 'aceptada' : 'rechazada'; r.resolvedAt = today();

    a.clubId = r.clubId;
    if (a.role === 'apoderado') { const g = guardian(a.refId); g.clubs = [...new Set([...(g.clubs || []), r.clubId])]; }
    if (a.id === S.session.accountId) applyAccount(a);
  }
  notify(a.role, `${club(r.clubId).short} ${ok ? 'aceptó' : 'rechazó'} la vinculación de ${a.name}.`, '/inicio');
}

// --- Documentos verificables ---
function registerDoc(code, type, title, holder) {
  if (!S.docs.some(d => d.code === code)) S.docs.push({ code, type, title, holder, date: today() });
  return code;
}
// --- Pagos simulados ---
function ensureReceipt(c) {
  if (c.receiptId && S.receipts.find(r => r.id === c.receiptId)) return c.receiptId;
  const id = uid('rc'); const code = docCode('CP', id);
  S.receipts.push({ id, number: nextSeq(), date: c.paidAt || today(), method: 'Webpay (simulado)', amount: c.amount, items: [{ concept: c.concept, amount: c.amount }], payer: c.playerId ? player(c.playerId).name : (club(c.clubId) || {}).name, payee: payeeOf(c), code });
  c.receiptId = id; registerDoc(code, 'Comprobante de pago', c.concept, c.playerId ? player(c.playerId).name : (club(c.clubId) || {}).name);
  return id;
}
function payeeOf(c) {
  if (c.kind === 'federacion' || c.kind === 'pase') return fedName(c.meta && c.meta.sport) || 'Federación';
  if (c.kind === 'proveedor') return provider(c.meta.providerId).name;
  return (club(c.clubId) || {}).name || 'Club';
}
function paidHooks(c) {
  const m = c.meta || {};
  if (c.kind === 'federacion') issueCredential(c.playerId, m.sport, c.clubId);
  if (c.kind === 'pase') completeTransfer(m.transferId);
  if (c.kind === 'prestamo') { const l = S.loans.find(x => x.id === m.loanId); if (l) l.paidAt = today(); }
  if (c.kind === 'proveedor') {
    const q = S.quotes.find(x => x.id === m.quoteId);
    if (q) { q.status = 'pagada'; q.paidAt = today(); notify('proveedor', `Pago recibido de ${club(q.clubId).short}: ${clp(q.amount)}, neto ${clp(netOf(q))} tras comisión.`, '/p/cotizacion/' + q.id); }
    S.movements.push({ id: uid('mv'), clubId: c.clubId, type: 'egreso', category: 'Implementos', concept: c.concept, amount: c.amount, date: today() });
  } else if (['mensual', 'extraordinaria', 'matricula'].includes(c.kind)) {
    S.movements.push({ id: uid('mv'), clubId: c.clubId, type: 'ingreso', category: c.kind === 'matricula' ? 'Matrículas' : c.kind === 'mensual' ? 'Cuotas mensuales' : 'Inscripciones', concept: c.concept, amount: c.amount, date: today() });
  }
  if (c.playerId) checkAnnulBaja(c.playerId, c.clubId);
}
function payCharges(ids, method) {
  const list = ids.map(id => S.charges.find(c => c.id === id)).filter(c => c && c.status === 'pendiente');
  if (!list.length) return null;
  const id = uid('rc'), code = docCode('CP', id), first = list[0];
  const payer = first.playerId ? player(first.playerId).name : (club(first.clubId) || {}).name;
  S.receipts.push({ id, number: nextSeq(), date: today(), method, amount: sum(list, c => c.amount), items: list.map(c => ({ concept: c.concept, amount: c.amount })), payer, payee: payeeOf(first), code });
  registerDoc(code, 'Comprobante de pago', list.length > 1 ? `${list.length} conceptos` : first.concept, payer);
  list.forEach(c => { c.status = 'pagado'; c.paidAt = today(); c.receiptId = id; paidHooks(c); });
  return id;
}
function addCharge(o) { const c = { id: uid('c'), status: 'pendiente', paidAt: null, due: addDays(today(), 10), ...o }; S.charges.push(c); return c; }

// --- Credencial federada ---
const season = () => parse(today()).getFullYear();
const credentialOf = (pid, sp) => S.credentials.find(c => c.playerId === pid && c.sport === sp && c.season === season());
function issueCredential(pid, sp, cid) {
  if (credentialOf(pid, sp)) return;
  const code = docCode('CF', pid + sp + season());
  S.credentials.push({ id: uid('cr'), playerId: pid, sport: sp, clubId: cid, season: season(), date: today(), code });
  const m = activeInSport(pid, sp); if (m) m.federated = true;
  registerDoc(code, 'Credencial federada', `${sp} · temporada ${season()}`, player(pid).name);
  notify(role(), `Tu credencial federada de ${sp} ya está disponible.`, '/j/credencial');
}

// --- Incorporación (reglas 1, 2 y 8) ---
const MSG_INCORPORACION = 'El club ha recibido su solicitud de incorporación. Cuando el club la acepte, aparecerá como jugador hábil.';
function requestJoin(pid, clubId, sport, teamId, note) {
  const dup = activeInSport(pid, sport);
  if (dup) return { error: `${player(pid).first} ya pertenece a ${club(dup.clubId).short} en ${sport}. Un deportista solo puede estar en un club por deporte: usa Cambio de club.` };
  const mid = uid('m');
  S.memberships.push({ id: mid, playerId: pid, clubId, sport, teamId: teamId || null, status: 'pendiente', since: today(), until: null, federated: false });
  S.requests.push({ id: uid('rq'), playerId: pid, clubId, sport, membershipId: mid, date: today(), status: 'pendiente', note: note || '' });
  notify('directivo', `Nueva solicitud de incorporación: ${player(pid).name} (${sport}).`, '/d/solicitudes', clubId);
  return { ok: true };
}
function resolveRequest(id, accept) {
  const r = S.requests.find(x => x.id === id); const m = S.memberships.find(x => x.id === r.membershipId);
  r.status = accept ? 'aceptada' : 'rechazada'; r.resolvedAt = today();
  if (accept) { m.status = 'habil'; m.since = today(); if (!m.teamId) { const t = S.teams.find(x => x.clubId === r.clubId && x.sport === r.sport); if (t) m.teamId = t.id; } }
  else S.memberships = S.memberships.filter(x => x.id !== m.id);
  notify(['jugador', 'apoderado'], `${club(r.clubId).short} ${accept ? 'aceptó' : 'rechazó'} la solicitud de ${player(r.playerId).name} en ${r.sport}.`, '/tramites');
}

// --- Transferencias (regla 3) ---
function createTransfer(pid, sport, toClub, reason) {
  const m = activeInSport(pid, sport); const debt = debtOf(pid, m.clubId);
  const t = { id: uid('tr'), playerId: pid, sport, fromClub: m.clubId, toClub, reason, date: today(), debt, status: debt > 0 ? 'pendiente_autorizacion' : 'pendiente_pago', chargeId: null };
  S.transfers.push(t);
  if (debt > 0) notify('directivo', `${player(pid).name} pide transferencia a ${club(toClub).short} con deuda de ${clp(debt)}. Requiere tu autorización.`, '/d/solicitudes', m.clubId);
  else chargePase(t);
  return t;
}
function chargePase(t) {
  const c = addCharge({ playerId: t.playerId, clubId: t.fromClub, concept: `Pase ${t.sport}: ${club(t.fromClub).short} → ${club(t.toClub).short}`, kind: 'pase', amount: S.fedConfig[t.sport].pase, meta: { transferId: t.id, sport: t.sport } });
  t.chargeId = c.id; return c;
}
function completeTransfer(id) {
  const t = S.transfers.find(x => x.id === id); if (!t) return;
  const m = activeInSport(t.playerId, t.sport);
  if (m) { m.status = 'desvinculado'; m.until = today(); }
  const nt = S.teams.find(x => x.clubId === t.toClub && x.sport === t.sport);
  S.memberships.push({ id: uid('m'), playerId: t.playerId, clubId: t.toClub, sport: t.sport, teamId: nt ? nt.id : null, status: 'habil', since: today(), until: null, federated: m ? m.federated : false, number: m ? m.number : null });
  t.status = 'completada'; t.doneAt = today();
  notify(['jugador', 'apoderado', 'directivo'], `Transferencia completada: ${player(t.playerId).name} ahora juega en ${club(t.toClub).short}.`, '/tramites', t.fromClub);
}

// --- Renuncia y baja (reglas 4 a 7) ---
function createSeparation(o) {
  const sep = { id: uid('sp'), start: today(), deadline: addBusinessDays(today(), 10), status: 'en_plazo', attachments: [], ...o };
  S.separations.push(sep);
  const m = activeInSport(sep.playerId, sep.sport); if (m) m.status = 'suspendido';
  const nombre = player(sep.playerId).name;
  if (sep.type === 'baja') notify(['jugador', 'apoderado'], `Baja iniciada para ${nombre} en ${sep.sport}. Motivo: ${sep.reasons.join(', ')}. Plazo para reclamar o subsanar: ${fDate(sep.deadline)}.`, '/plazo/' + sep.id);
  else notify('directivo', `Renuncia recibida de ${nombre} (${sep.sport}). Motivos: ${sep.reasons.join(', ')}.`, '/plazo/' + sep.id, sep.clubId);
  return sep;
}
function annulSeparation(sep, why) {
  sep.status = 'anulada'; sep.closedAt = today(); sep.closeReason = why;
  const m = activeInSport(sep.playerId, sep.sport); if (m) m.status = 'habil';
  notify(['jugador', 'apoderado', 'directivo'], `${sep.type === 'baja' ? 'Baja' : 'Renuncia'} de ${player(sep.playerId).name} anulada: ${why}. Vuelve a estar Hábil.`, '/plazo/' + sep.id, sep.clubId);
}
function finalizeSeparation(sep, why) {
  sep.status = 'firme'; sep.closedAt = today(); sep.closeReason = why;
  const m = activeInSport(sep.playerId, sep.sport); if (m) { m.status = 'desvinculado'; m.until = today(); }
  sep.code = docCode('DV', sep.id);
  registerDoc(sep.code, 'Comprobante de desvinculación', `${club(sep.clubId).short} · ${sep.sport}`, player(sep.playerId).name);
  notify(['jugador', 'apoderado', 'directivo'], `Desvinculación firme de ${player(sep.playerId).name} en ${sep.sport}. Comprobante disponible.`, '/plazo/' + sep.id, sep.clubId);
}
function checkAnnulBaja(pid, cid) {
  S.separations.filter(x => x.playerId === pid && x.clubId === cid && x.type === 'baja' && x.cause === 'no_pago' && ['en_plazo', 'reclamo'].includes(x.status))
    .forEach(x => { if (debtOf(pid, cid) === 0) { annulSeparation(x, 'deuda pagada dentro del plazo'); (S.claims.filter(c => c.sepId === x.id && c.status === 'abierto')).forEach(c => { c.status = 'resuelto'; c.resolution = 'Baja anulada automáticamente por pago de la deuda.'; }); } });
}
function processDeadlines() {
  let n = 0;
  S.separations.filter(x => x.status === 'en_plazo' && today() > x.deadline).forEach(x => { finalizeSeparation(x, 'venció el plazo de 10 días hábiles'); n++; });

}

function qr(text, size = 148) {

  let d = '';

    let on; const F = [[0, 0], [N - 7, 0], [0, N - 7]].find(([ox, oy]) => inF(c, r, ox, oy));
    if (F) on = finder(c, r, F[0], F[1]);
    else if ((c < 8 && r < 8) || (c > N - 9 && r < 8) || (c < 8 && r > N - 9)) on = false;
    else if (r === 6) on = c % 2 === 0; else if (c === 6) on = r % 2 === 0; else on = next();
    if (on) d += `M${c + 2} ${r + 2}h1v1h-1z`;
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${N + 4} ${N + 4}" role="img" aria-label="Código QR de verificación ${esc(text)}" shape-rendering="crispEdges"><rect width="${N + 4}" height="${N + 4}" fill="#fff"/><path d="${d}" fill="#101828"/></svg>`;
}

// --- Foto de perfil y logo del club: se reducen antes de guardarlos ---
function readImage(file, max, type) {
  return new Promise((ok, no) => {
    if (!/^image\//.test(file.type)) return no(new Error('tipo'));
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const w = im.naturalWidth || max, h = im.naturalHeight || max, r = Math.min(1, max / Math.max(w, h)), cv = document.createElement('canvas');
      cv.width = Math.round(w * r); cv.height = Math.round(h * r); cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url); ok(cv.toDataURL(type, 0.82));
    };
    im.onerror = () => { URL.revokeObjectURL(url); no(new Error('imagen')); };
    im.src = url;
  });
}

function deleteAccount(a) {
  S.linkRequests = S.linkRequests.filter(r => r.accountId !== a.id);
  const anon = o => Object.assign(o, { name: 'Usuario eliminado', first: 'Usuario', rut: '', email: '', phone: '', photo: null, birth: o.birth, city: '', height: null, size: '' });
  if (a.type === 'jugador') { const p = player(a.refId); activeMems(p.id).forEach(m => { m.status = 'desvinculado'; m.until = today(); }); S.requests.filter(r => r.playerId === p.id && r.status === 'pendiente').forEach(r => { r.status = 'rechazada'; }); anon(p); }
  if (a.type === 'apoderado') S.guardians = S.guardians.filter(g => g.id !== a.refId);
  if (a.type === 'proveedor') Object.assign(provider(a.refId), { name: 'Proveedor eliminado', items: [], venues: [], desc: '', web: '', ig: '', photo: null });
  if (a.type === 'club') Object.assign(club(a.clubId), { logo: null, board: [], email: '', phone: '', address: '', web: '', ig: '', desc: '', closed: true });
  S.accounts = S.accounts.filter(x => x.id !== a.id);
}
A.deleteAsk = () => {
  if (acct().demo) return toast('Las cuentas de demostración no se eliminan', 'warn');
  sheet('Eliminar mi cuenta', `<p class="small muted" style="margin:0 0 12px">Se borrarán tu cuenta y tus datos personales. Los registros que un club o federación deba conservar quedarán sin tus datos de identificación. Esta acción no se puede deshacer.</p>${inp('del-pw', 'Confirma con tu clave', 'type="password" autocomplete="off"')}<div class="err mb8" id="del-err"></div>${btn('Eliminar definitivamente', 'A.deleteDo()', 'danger')}<div class="mt8">${btn('Cancelar', 'closeSheet()', 's2')}</div>`);
};
A.deleteDo = () => { const a = acct(); if (a.pass !== hash(val('del-pw'))) { $('#del-err').textContent = 'La clave no es correcta.'; return; } deleteAccount(a); const d = demoAccount('jugador'); S.session.homeId = d.id; applyAccount(d); S.session.loggedIn = false; save(); NAV.length = 0; closeSheet(); replaceTo('/login'); toast('Tu cuenta fue eliminada'); };

// --- Moderación de contenido (App Store 1.2 y Google Play): filtrar, reportar y bloquear ---
const OFENSIVAS = /(^|[^a-záéíóúñ])(we[oó]n(es)?|culiao|conchetumare|ctm|maric[oó]n|put[ao]s?|mierda|imb[eé]cil)([^a-záéíóúñ]|$)/i;
const limpio = t => { if (!OFENSIVAS.test(t)) return true; toast('Tu mensaje contiene lenguaje ofensivo', 'bad'); return false; };
const myBlocks = () => S.blocks[me().id] || [];
const REPORT_M = ['Contenido ofensivo', 'Acoso o amenazas', 'Datos personales de otra persona', 'Contenido inapropiado sobre menores', 'Otro'];
A.reportSheet = id => { const p = S.posts.find(x => x.id === id), mine = p.by === me().name; sheet('Reportar publicación', `${select('rp-m', 'Motivo', REPORT_M, REPORT_M[0])}${btn('Enviar reporte', `A.doReport('${id}')`, 'danger', 'flag')}${!p.official && !mine ? `<div class="mt8">${btn('Bloquear a ' + esc(p.by), `A.block('${id}')`, 's2')}</div>` : ''}`); };
A.doReport = id => { const p = S.posts.find(x => x.id === id); S.reports.unshift({ id: uid('rp'), postId: id, by: me().id, byName: me().name, reason: val('rp-m'), date: today(), status: 'abierto', clubId: p.clubId }); notify('directivo', `Publicación reportada en el muro: ${val('rp-m')}.`, '/d/reclamos', p.clubId); closeSheet(); commit('Reporte enviado: el club lo revisará'); };
A.block = id => { const n = S.posts.find(x => x.id === id).by, m = me().id; S.blocks[m] = [...new Set([...myBlocks(), n])]; closeSheet(); commit('Usuario bloqueado'); };
A.chatMenu = id => { const c = S.chats.find(x => x.id === id); sheet('Opciones del chat', `${btn('Reportar conversación', `A.chatReport('${id}')`, 'danger', 'flag')}${c.type === 'directo' ? `<div class="mt8">${btn('Bloquear a ' + esc(c.title), `A.chatBlock('${id}')`, 's2')}</div>` : ''}`); };
A.chatReport = id => { const c = S.chats.find(x => x.id === id), cl = myClubs()[0] || null; S.reports.unshift({ id: uid('rp'), chatId: id, by: me().id, byName: me().name, reason: 'Conversación: ' + c.title, date: today(), status: 'abierto', clubId: cl }); notify('directivo', `Conversación reportada: ${c.title}.`, '/d/reclamos', cl); closeSheet(); commit('Reporte enviado: el club lo revisará'); };
A.chatBlock = id => { const c = S.chats.find(x => x.id === id), m = me().id; S.blocks[m] = [...new Set([...myBlocks(), c.title])]; save(); closeSheet(); replaceTo('/mensajes'); toast('Usuario bloqueado'); };
A.resolveReport = (id, hide) => { const r = S.reports.find(x => x.id === id); r.status = 'resuelto'; const p = r.postId && S.posts.find(x => x.id === r.postId); if (hide && p) p.hidden = true; commit(hide ? 'Contenido ocultado' : 'Reporte descartado'); };

// --- Documentos legales (borradores para revisión de un abogado) ---
const LEGAL = {
  'eliminar-cuenta': ['Eliminar cuenta de My Club', [['Desde la app', 'Entra a Perfil, toca Eliminar mi cuenta y confirma con tu clave. La eliminación es inmediata.'], ['Sin la app instalada', 'Escribe al contacto de soporte de My Club desde el email de tu cuenta e indica que deseas eliminarla. Correo de soporte: pendiente de completar antes del lanzamiento.'], ['Qué se elimina', 'Tu cuenta, tu foto y tus datos personales de contacto.'], ['Qué se conserva', 'Los registros contables o federativos que la ley obligue a mantener quedan sin tus datos de identificación.']]],
  contacto: ['Ayuda y contacto', [['Soporte', 'Correo de soporte: pendiente de completar antes del lanzamiento.'], ['Reportar contenido', 'En el muro y en los chats, toca la bandera para reportar contenido o bloquear a una persona. El club lo revisa en su bandeja de reclamos.']]],
  privacidad: ['Política de privacidad', [['Responsable', 'My Club administra esta aplicación. Datos de contacto del responsable: pendientes de completar antes del lanzamiento.'], ['Datos que tratamos', 'Nombre, RUT, email, teléfono y fecha de nacimiento; estatura, talla y foto si decides agregarlas; datos deportivos, pagos y documentos asociados a tu club.'], ['Menores de edad', 'Los datos de menores solo los registra su apoderado, quien actúa en su representación.'], ['Para qué los usamos', 'Administrar tu cuenta, tu vínculo con clubes y federaciones, cobros, certificados y comunicaciones del club.'], ['Con quién se comparten', 'Con los clubes y federaciones a los que te vinculas, y con proveedores tecnológicos que prestan el servicio. No vendemos datos personales.'], ['Tus derechos', 'Puedes acceder, rectificar y eliminar tus datos. La cuenta se elimina desde Perfil → Eliminar mi cuenta.'], ['Conservación', 'Guardamos los datos mientras la cuenta exista y por los plazos que exija la ley para registros contables o federativos.']]],
  terminos: ['Términos de uso', [['Uso de la app', 'My Club es una herramienta para administrar clubes deportivos, asociaciones y federaciones. Debes entregar información verdadera.'], ['Cuentas', 'Eres responsable de tu clave. Los menores de edad se registran mediante su apoderado.'], ['Pagos', 'Los pagos a clubes, federaciones y proveedores corresponden a servicios fuera de la app y se rigen por las condiciones de cada entidad.'], ['Contenido', 'Lo que publiques debe respetar a otras personas. Podemos retirar contenido ilegal u ofensivo.'], ['Modificaciones', 'Avisaremos los cambios relevantes de estos términos dentro de la app.']]]
};
route('/legal/:doc', {
  public: true, noTabs: true, title: p => (LEGAL[p.doc] || ['Documento'])[0], render: p => {
    const d = LEGAL[p.doc]; if (!d) return empty('doc', 'Documento no encontrado', '');
    return note('Borrador sujeto a revisión legal antes del lanzamiento.', 'warn') + `<div class="card">${d[1].map(([t, x]) => `<h3 class="mt12">${t}</h3><p class="small" style="margin:4px 0 0">${x}</p>`).join('')}</div>`;
  }
});

// @@PANTALLAS@@

/* ======================================================================
   ARRANQUE
   ====================================================================== */
S = load();
processDeadlines();
save();
NAV.push(location.hash || '#/inicio');
render(true);
const NATIVO = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
if (NATIVO && window.Capacitor.Plugins.App) window.Capacitor.Plugins.App.addListener('backButton', () => { if ($('.sheet')) closeSheet(); else if (NAV.length > 1) A.back(); else window.Capacitor.Plugins.App.exitApp(); });
if (!NATIVO && 'serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW no registrado', e));
</script>
</body>
